<!DOCTYPE html>
<html>
<head>
  <title>Best Massage 28</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 50px auto;
      width: 300px;
      border-radius: 15px;
    }

    input, button {
      margin: 5px;
      padding: 10px;
      width: 90%;
    }

    button {
      background: green;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<h1>💆 Best Massage 28</h1>

<div class="box">
  <h3>Цаг захиалах</h3>

  <input id="name" placeholder="Нэр">
  <input id="phone" placeholder="Утас">
  <input id="date" type="date">
  <input id="time" type="time">

  <button onclick="book()">Захиалах</button>
</div>

<script>
function book() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;

  if (!name || !phone || !date || !time) {
    alert("Бүгдийг бөглөнө үү!");
    return;
  }

  alert("Цаг амжилттай захиалагдлаа!\n" + name);
}
</script>

</body>
</html>
