<!DOCTYPE html>
<html>
<head>
  <title>Best Massage 28</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 40px auto;
      width: 300px;
      border-radius: 15px;
    }

    input, select, button {
      margin: 5px;
      padding: 10px;
      width: 90%;
      border-radius: 8px;
    }

    button {
      background: green;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<h1>💆 Best Massage 28</h1>

<div class="box">
  <h3>Цаг захиалах</h3>

  <input id="name" placeholder="Нэр">
  <input id="phone" placeholder="Утас">

  <select id="therapist">
    <option>Батаа</option>
    <option>Сараа</option>
    <option>Болд</option>
  </select>

  <input id="date" type="date">
  <input id="time" type="time">

  <button onclick="book()">Захиалах</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB...",
  authDomain: "todo-app-a916f.firebaseapp.com",
  projectId: "todo-app-a916f",
  storageBucket: "todo-app-a916f.firebasestorage.app",
  messagingSenderId: "413234357697",
  appId: "1:413234357697:web:2b7b8e038d4ec030ed7b40"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function book() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;
  let therapist = document.getElementById("therapist").value;

  if (!name || !phone || !date || !time) {
    alert("Бүгдийг бөглөнө үү!");
    return;
  }

  db.collection("bookings")
    .add({
      name: name,
      phone: phone,
      date: date,
      time: time,
      therapist: therapist
    })
    .then(() => {
      alert("✅ Амжилттай захиалагдлаа!");
    })
    .catch(err => {
      alert("❌ Алдаа: " + err.message);
    });
}
</script>

</body>
</html>
