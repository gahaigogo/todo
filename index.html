<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 65%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #4facfe;
      color: white;
      cursor: pointer;
    }

    li {
      background: #f1f1f1;
      margin-top: 8px;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }

    .delete {
      background: red;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">
  <h1>✨ Todo App</h1>

  <input id="taskInput" placeholder="Task бич">
  <button onclick="addTask()">Нэмэх</button>

  <ul id="list"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function render() {
  let list = document.getElementById("list");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    let li = document.createElement("li");

    li.innerHTML = `
      ${task}
      <button class="delete" onclick="deleteTask(${index})">X</button>
    `;

    list.appendChild(li);
  });
}

function addTask() {
  let input = document.getElementById("taskInput");

  if (input.value === "") return;

  tasks.push(input.value);
  saveTasks();
  render();

  input.value = "";
}

function deleteTask(index) {
  tasks.splice(index, 1);
  saveTasks();
  render();
}

// Эхлэхэд шууд ачаална
render();
</script>

</body>
</html>
