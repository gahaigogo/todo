<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>
</head>
<body>

<h2>Захиалгууд</h2>
<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "ЭНД ЧИНИЙХ",
  authDomain: "todo-app-a916f.firebaseapp.com",
  projectId: "todo-app-a916f",
  storageBucket: "todo-app-a916f.firebasestorage.app",
  messagingSenderId: "413234357697",
  appId: "1:413234357697:web:2b7b8e038d4ec030ed7b40"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collection("bookings").get().then(snapshot => {
  snapshot.forEach(doc => {
    let d = doc.data();
    let div = document.getElementById("list");
    div.innerHTML += `<p>${d.name} - ${d.date} ${d.time}</p>`;
  });
});
</script>

</body>
</html>
